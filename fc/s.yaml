# 阿里云函数计算 FC 部署配置（Serverless Devs，fc3 组件）
# 用法：
#   1) 安装 Serverless Devs：npm install -g @serverless-devs/s
#   2) 配置密钥：s config add  （按提示填入阿里云 AccessKey ID/Secret，alias 填 default）
#   3) 准备镜像：先把镜像推到同地域 ACR（见 DEPLOY-ALIYUN-FC.md），再把下方 IMAGE 改好
#   4) 设置环境变量：export IMAGE=registry.cn-hangzhou.aliyuncs.com/<命名空间>/taobao-fruit-monitor:latest
#                    export PUSHPLUS_TOKEN=你的token
#   5) 部署：s deploy -y
#
# 说明：
#   - runtime: custom-container，监听 9000 端口（与 Dockerfile / server.js 一致）
#   - 定时触发器每 10 分钟以 HTTP 请求调起容器 -> 触发一次采集+PushPlus 推送
#   - 平时实例缩容到 0，无请求不收费；免费额度内基本零成本
edition: 3.0.0
name: taobao-fruit-monitor-fc
access: default

services:
  monitor:
    component: fc3
    props:
      region: cn-hangzhou
      service:
        name: tbmon-svc
        description: 淘宝闪购/饿了么水果价格监控（PushPlus 推送）
        internetAccess: true
      function:
        name: tbmon-fn
        runtime: custom-container
        cpu: 1
        memorySize: 1024          # 压到 1GB 以贴合免费额度；Chromium 最低也需 ~1GB
        timeout: 300              # Chromium 冷启动+采集可能 60~150s，给足 5 分钟
        diskSize: 512
        environmentVariables:
          PUSHPLUS_TOKEN: ${env('PUSHPLUS_TOKEN')}
          INTERVAL_MIN: '10'
          STATE_DIR: /app/state
          DATA_DIR: /app/.data
          NODE_ENV: production
        customContainerConfig:
          image: ${env('IMAGE')}
          port: 9000
          healthCheckConfig:
            httpGetUrl: /health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
      triggers:
        # 手动测试用 HTTP 触发器（公网可访问，便于 curl 验证；如不需可删）
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - GET
              - POST
        # 每 10 分钟定时触发（chron 6 字段：秒 分 时 日 月 周；0/10 = 每 10 分钟）
        - name: timerTrigger
          type: timer
          config:
            enable: true
            cronExpression: '0 0/10 * * * *'
            payload: ''
