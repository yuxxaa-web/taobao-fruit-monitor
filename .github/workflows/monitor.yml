name: 淘宝水果监控 (PushPlus)

# 完全运行在 GitHub 上：定时触发 -> self-hosted runner（你国内常开机器）-> 采集 -> PushPlus 推送
# 不依赖 CloudBase，不消耗其资源。
# 登录态(browser-state.json)直接以【文件】形式放在 runner 本机（GitHub Secret 上限 64KB，登录态约 191KB 会超限），
# 仅 PUSHPLUS_TOKEN 作为 Secret 注入。
on:
  schedule:
    - cron: '*/10 * * * *'     # 每 10 分钟（UTC 时间）；GitHub 调度可能延迟数分钟，属正常
  workflow_dispatch: {}        # 允许在 Actions 页面手动触发

jobs:
  monitor:
    # 必须用 self-hosted runner：淘宝/饿了么数据依赖中国大陆 IP，GitHub 托管 runner 在海外会被风控/定位失败。
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false        # 保留 node_modules，避免每次重新安装

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备登录态 (browser-state.json)
        run: |
          # 自托管机器：登录态以文件形式放在本机，绕开 GitHub Secret 64KB 上限。
          # 默认目录 $HOME/tbmon-state；可用 Secret/变量 BROWSER_STATE_DIR 覆盖。
          # 上一轮快照与去重标记也存这个目录，跨次运行保留（价格涨跌/半小時汇总去重靠它）。
          DIR="${BROWSER_STATE_DIR:-$HOME/tbmon-state}"
          STATE_PATH="$DIR/browser-state.json"
          mkdir -p "$DIR"
          if [ -f "$STATE_PATH" ]; then
            echo "使用本机已有登录态: $STATE_PATH ($(wc -c < "$STATE_PATH") bytes)"
          elif [ -n "$BROWSER_STATE_B64" ]; then
            echo "$BROWSER_STATE_B64" | base64 -d > "$STATE_PATH"
            echo "已从 BROWSER_STATE_B64 还原 ($(wc -c < "$STATE_PATH") bytes)"
          else
            echo "ERROR: 未找到登录态。请将 browser-state.json 放到 $STATE_PATH，或设置 BROWSER_STATE_B64。"
            exit 1
          fi
          echo "STATE_PATH=$STATE_PATH" >> "$GITHUB_ENV"
          echo "STATE_DIR=$DIR" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm install

      - name: 安装 Playwright Chromium
        run: npx playwright install chromium

      - name: 采集并推送 (PushPlus)
        run: node run-once.js
